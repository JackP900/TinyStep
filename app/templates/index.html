<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <title>TinyStep</title>
</head>

<body>
    <!-- Logo for Header -->
    <svg class="logo" width="195" height="48" viewBox="0 0 260 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TinyStep">
        <rect width="64" height="64" rx="14" fill="#44c15e"/>
        <rect x="14" y="36" width="10" height="14" rx="3" fill="#ffffff"/>
        <rect x="27" y="26" width="10" height="24" rx="3" fill="#ffffff"/>
        <rect x="40" y="16" width="10" height="34" rx="3" fill="#ffffff"/>
        <text x="82" y="44" font-family="'Nunito', sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
            <tspan fill="#1a1a1a">Tiny</tspan><tspan fill="#44c15e">Step</tspan>
        </text>
    </svg>

    <p>Paste your assignment, and we'll break it down into tiny steps!</p>
    <textarea id="inputText"></textarea>

    <button id="execute">Break it down</button>

    <div id="statusBar" class="hidden">
        <div id="progressBar"><div id ="progressFill"></div></div>
        <p id="streak">Streak: 0</p>
    </div>

    <div id="steps"></div>

    <button id="continue" class="hidden">Continue</button>
    <div id="continueSteps"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
